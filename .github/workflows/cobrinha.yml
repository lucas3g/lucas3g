name: Atualizar métricas

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    name: Gerar metrics.svg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar SVG
        run: python3 .github/scripts/metrics.py
        env:
          # Opcional: crie o secret METRICS_TOKEN (PAT com read:user e repo) para contar PRs/contribuições privadas
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/metrics.svg
          git diff --staged --quiet || (git commit -m "chore: atualizar métricas" && git push)
