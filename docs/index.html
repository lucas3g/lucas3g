<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DOOM · Lucas Silva</title>
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css" />
  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #0d1117; color: #e6edf3; font-family: system-ui, sans-serif; }
    header { padding: 12px 16px; text-align: center; }
    header a { color: #58a6ff; }
    #doom { width: min(100%, 960px); height: calc(100vh - 110px); min-height: 360px; margin: 0 auto; }
    p.help { text-align: center; font-size: 14px; color: #8b949e; margin: 8px 0; }
  </style>
</head>
<body>
  <header>
    <strong>DOOM (shareware)</strong> · <a href="https://github.com/lucas3g">← voltar ao perfil</a>
  </header>
  <div id="doom"></div>
  <p class="help">Setas: mover · Ctrl: atirar · Espaço: abrir portas · Shift: correr · Enter: confirmar nos menus</p>
  <script>
    Dos(document.getElementById("doom"), {
      url: "https://cdn.dos.zone/custom/dos/doom.jsdos",
      autoStart: true,
      noSideBar: true,
      noFullscreen: false,
      lang: "pt-br"
    });
  </script>
</body>
</html>
